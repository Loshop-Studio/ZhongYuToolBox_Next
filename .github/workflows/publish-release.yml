name: Build and publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
      - windows/**
      - installer/**
      - pubspec.yaml
      - lib/core/config/app_config.dart
      - lib/features/study/**
      - assets/changelog.json

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install and verify Windows release bundle
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'build/windows/x64/runner/Release'
          cmake -S windows -B build/windows/x64 -G 'Visual Studio 17 2022' -A x64 -DCMAKE_INSTALL_PREFIX="$releaseDir"
          cmake --build build/windows/x64 --config Release --target INSTALL
          $requiredFiles = @(
            'zhongyu_toolbox.exe',
            'flutter_windows.dll',
            'flutter_inappwebview_windows_plugin.dll',
            'WebView2Loader.dll',
            'data/icudtl.dat',
            'data/app.so',
            'data/flutter_assets/AssetManifest.bin'
          )
          $missing = $requiredFiles | Where-Object { -not (Test-Path (Join-Path $releaseDir $_)) }
          if ($missing) {
            throw "Incomplete Windows release bundle. Missing: $($missing -join ', ')"
          }
      - name: Package Windows build
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value.Split('+')[0] })
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "zhongyu-toolbox-windows-v$version.zip"
          choco install innosetup --yes --no-progress
          New-Item -ItemType Directory -Force -Path 'build/installer' | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\zytb.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }
          Copy-Item "build/installer/zhongyu-toolbox-windows-v$version-setup.exe" "zhongyu-toolbox-windows-v$version-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            zhongyu-toolbox-windows-v*.zip
            zhongyu-toolbox-windows-v*-setup.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name APK
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          test -n "$version"
          cp build/app/outputs/flutter-apk/app-release.apk "zhongyu-toolbox-android-v${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: zhongyu-toolbox-android-v*.apk
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          test -n "$version"
          mkdir -p ipa/Payload
          ditto build/ios/iphoneos/Runner.app ipa/Payload/Runner.app
          (cd ipa && ditto -c -k --sequesterRsrc --keepParent Payload "../zhongyu-toolbox-ios-v${version}-unsigned.ipa")
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-release
          path: zhongyu-toolbox-ios-v*-unsigned.ipa
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
      - ios-unsigned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          tag="v${version}"
          notes=$(node -e "const c=require('./assets/changelog.json').changelog; const e=c.find(x=>x.version==='${version}'); if(!e) process.exit(2); process.stdout.write(e.text)")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --title "$tag" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" dist/* --clobber

